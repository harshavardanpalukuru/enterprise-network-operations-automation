---
- name: Audit Cisco network security and configuration compliance
  hosts: cisco
  gather_facts: false

  vars_files:
    - ../vars/compliance_policy.yml

  tasks:

    - name: Collect management ACL and VTY configuration
      cisco.ios.ios_command:
        commands:
          - show ip access-lists ACL-ADMIN-SSH
          - show running-config | section line vty
      register: access_output
      ignore_errors: true
      ignore_unreachable: true

    - name: Collect switch VLAN and trunk information
      cisco.ios.ios_command:
        commands:
          - show vlan brief
          - show interfaces trunk
      register: switch_output
      when: inventory_hostname in network_compliance.switches
      ignore_errors: true
      ignore_unreachable: true

    - name: Collect router ACL assignments and routing table
      cisco.ios.ios_command:
        commands:
          - show ip interface
          - show ip route
      register: router_output
      when: inventory_hostname in network_compliance.routers
      ignore_errors: true
      ignore_unreachable: true

    - name: Store normalized management command output
      ansible.builtin.set_fact:
        noc_access_acl_text: "{{ ((access_output.stdout | default(['']))[0] | default('')).split() | join(' ') }}"
        noc_vty_text: "{{ ((access_output.stdout | default(['','']))[1] | default('')).split() | join(' ') }}"
    - name: Initialize compliance checks
      ansible.builtin.set_fact:
        noc_compliance_checks:
          - control: Management SSH ACL
            status: >-
              {{
                'PASS'
                if (
                  network_compliance.management_access.required_acl_fragments
                  | reject('in', noc_access_acl_text)
                  | list | length == 0
                )
                else 'FAIL'
              }}

          - control: VTY SSH restrictions
            status: >-
              {{
                'PASS'
                if (
                  network_compliance.management_access.required_vty_fragments
                  | reject('in', noc_vty_text)
                  | list | length == 0
                )
                else 'FAIL'
              }}

    # ------------------------------------------------
    # SWITCH COMPLIANCE
    # ------------------------------------------------

    - name: Check expected VLANs and access-port assignments
      ansible.builtin.set_fact:
        noc_vlan_check: >-
          {% set output = (switch_output.stdout | default(['']))[0] | default('') %}
          {% set lines = output.splitlines() %}
          {% set ns = namespace(ok=true) %}
          {% for vlan in network_compliance.switches[inventory_hostname].vlans %}
          {% set state = namespace(found=false, ports_ok=true) %}
          {% for line in lines %}
          {% set fields = line.split() %}
          {% if fields | length >= 3 and fields[0] == (vlan.id | string) and fields[1] == vlan.name and fields[2] == 'active' %}
          {% set state.found = true %}
          {% for port in vlan.access_ports | default([]) %}
          {% if port not in line %}
          {% set state.ports_ok = false %}
          {% endif %}
          {% endfor %}
          {% endif %}
          {% endfor %}
          {% if not state.found or not state.ports_ok %}
          {% set ns.ok = false %}
          {% endif %}
          {% endfor %}
          {{ ns.ok }}
      when: inventory_hostname in network_compliance.switches
    - name: Check 802.1Q trunk configuration
      ansible.builtin.set_fact:
        noc_trunk_check: >-
          {% set trunk = network_compliance.switches[inventory_hostname].trunk %}
          {% set output = (switch_output.stdout | default(['','']))[1] | default('') %}
          {% set expected_allowed = trunk.allowed_vlans | map('string') | join(',') %}
          {% set state = namespace(operational=false, allowed_count=0) %}
          {% for line in output.splitlines() %}
          {% set fields = line.split() %}
          {% if fields | length >= 5 and fields[0] == trunk.interface and fields[2] == '802.1q' and fields[3] == 'trunking' and fields[4] == (trunk.native_vlan | string) %}
          {% set state.operational = true %}
          {% endif %}
          {% if fields | length == 2 and fields[0] == trunk.interface and fields[1] == expected_allowed %}
          {% set state.allowed_count = state.allowed_count + 1 %}
          {% endif %}
          {% endfor %}
          {{ state.operational and state.allowed_count >= 3 }}
      when: inventory_hostname in network_compliance.switches
    - name: Add switch compliance results
      ansible.builtin.set_fact:
        noc_compliance_checks: >-
          {{
            noc_compliance_checks + [
              {
                'control': 'Expected VLANs and access ports',
                'status': 'PASS' if (noc_vlan_check | trim | bool) else 'FAIL'
              },
              {
                'control': '802.1Q trunk and allowed VLANs',
                'status': 'PASS' if (noc_trunk_check | trim | bool) else 'FAIL'
              }
            ]
          }}
      when: inventory_hostname in network_compliance.switches

    # ------------------------------------------------
    # ROUTER COMPLIANCE
    # ------------------------------------------------

    - name: Check router interface ACL assignments
      ansible.builtin.set_fact:
        noc_router_acl_check: >-
          {% set output = (router_output.stdout | default(['']))[0] | default('') %}
          {% set lines = output.splitlines() %}
          {% set ns = namespace(ok=true) %}
          {% for item in network_compliance.routers[inventory_hostname].interface_acls %}
          {% set state = namespace(in_block=false, found=false) %}
          {% for line in lines %}
          {% if line.startswith(item.interface ~ ' is ') %}
          {% set state.in_block = true %}
          {% elif line and not line[0].isspace() %}
          {% set state.in_block = false %}
          {% endif %}
          {% if state.in_block and 'Inbound' in line and line.split()[-1] == item.acl %}
          {% set state.found = true %}
          {% endif %}
          {% endfor %}
          {% if not state.found %}
          {% set ns.ok = false %}
          {% endif %}
          {% endfor %}
          {{ ns.ok }}
      when: inventory_hostname in network_compliance.routers
    - name: Check expected static routes
      ansible.builtin.set_fact:
        noc_static_route_check: >-
          {% set output = (router_output.stdout | default(['','']))[1] | default('') %}
          {% set ns = namespace(ok=true) %}
          {% for route in network_compliance.routers[inventory_hostname].static_routes %}
          {% set state = namespace(found=false) %}
          {% for line in output.splitlines() %}
          {% set fields = line.split() %}
          {% if fields | length >= 5 and fields[0] == 'S' and fields[1] == route.destination and fields[3] == 'via' and fields[4] == route.next_hop %}
          {% set state.found = true %}
          {% endif %}
          {% endfor %}
          {% if not state.found %}
          {% set ns.ok = false %}
          {% endif %}
          {% endfor %}
          {{ ns.ok }}
      when: inventory_hostname in network_compliance.routers
    - name: Add router compliance results
      ansible.builtin.set_fact:
        noc_compliance_checks: >-
          {{
            noc_compliance_checks + [
              {
                'control': 'Router interface ACL assignments',
                'status': 'PASS' if (noc_router_acl_check | trim | bool) else 'FAIL'
              },
              {
                'control': 'Expected static routes',
                'status': 'PASS' if (noc_static_route_check | trim | bool) else 'FAIL'
              }
            ]
          }}
      when: inventory_hostname in network_compliance.routers

    # ------------------------------------------------
    # DEVICE COMPLIANCE RESULT
    # ------------------------------------------------

    - name: Calculate final device compliance status
      ansible.builtin.set_fact:
        noc_compliance_result:
          device: "{{ inventory_hostname }}"
          management_ip: "{{ ansible_host }}"
          status: >-
            {{
              'PASS'
              if (
                noc_compliance_checks
                | selectattr('status', 'equalto', 'FAIL')
                | list | length == 0
              )
              else 'FAIL'
            }}
          checks: "{{ noc_compliance_checks }}"


- name: Generate consolidated compliance report
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    report_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S') }}"

  tasks:

    - name: Aggregate Cisco compliance results
      ansible.builtin.set_fact:
        compliance_results: "{{ groups['cisco'] | map('extract', hostvars, 'noc_compliance_result') | list }}"

    - name: Generate JSON compliance report
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../../reports/ansible_compliance_{{ report_timestamp }}.json"
        mode: "0600"
        content: >-
          {{
            {
              'report_type': 'Ansible Network Security and Compliance Audit',
              'generated_at': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'),
              'summary': {
                'total_devices': compliance_results | length,
                'compliant': compliance_results | selectattr('status', 'equalto', 'PASS') | list | length,
                'non_compliant': compliance_results | selectattr('status', 'equalto', 'FAIL') | list | length
              },
              'devices': compliance_results
            } | to_nice_json
          }}

    - name: Display compliance summary
      ansible.builtin.debug:
        msg:
          - "Total devices: {{ compliance_results | length }}"
          - "Compliant: {{ compliance_results | selectattr('status', 'equalto', 'PASS') | list | length }}"
          - "Non-compliant: {{ compliance_results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
